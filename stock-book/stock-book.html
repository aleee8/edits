<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر المخزن</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a6b66'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='8' width='2' height='16'/%3E%3Crect x='11' y='8' width='1' height='16'/%3E%3Crect x='14' y='8' width='3' height='16'/%3E%3Crect x='19' y='8' width='1' height='16'/%3E%3Crect x='22' y='8' width='3' height='16'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: counter-side app shell. A dark shelf-strip bar with page tabs, then one working column;
   every work page leads with the scan box, and a product's shelf location is the loudest fact on screen. */
:root {
  --bg: #eef3f2;
  --surface: #ffffff;
  --surface-2: #f5f8f7;
  --ink: #12211f;
  --muted: #566764;
  --line: #d6e0de;
  --accent: #0a6b66;
  --accent-strong: #08514d;
  --accent-ink: #ffffff;
  --accent-soft: #dbeeeb;
  --ok: #1d7340;
  --ok-soft: #dcf1e3;
  --warn: #8a5000;
  --warn-soft: #fbedd5;
  --bad: #b3261e;
  --bad-soft: #fbe2df;
  --on-bad: #ffffff;
  --bar: #0f2a28;
  --bar-ink: #eaf4f2;
  --bar-muted: #a9c2be;
  --bar-hover: rgba(255, 255, 255, .07);
  --bar-active: rgba(255, 255, 255, .12);
  --bar-accent: #4fd1c3;
  --scrim: rgba(8, 20, 19, .55);
  --shadow: 0 1px 2px rgba(10, 40, 38, .06), 0 6px 18px rgba(10, 40, 38, .07);
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1413;
    --surface: #13201e;
    --surface-2: #182826;
    --ink: #e2ecea;
    --muted: #93a7a3;
    --line: #253532;
    --accent: #3dbdb1;
    --accent-strong: #74d8cd;
    --accent-ink: #052220;
    --accent-soft: #123430;
    --ok: #63c98b;
    --ok-soft: #13301f;
    --warn: #f0b04a;
    --warn-soft: #36280f;
    --bad: #f08a80;
    --bad-soft: #3a1a17;
    --on-bad: #2a0d0a;
    --bar: #08100f;
    --bar-ink: #e2ecea;
    --bar-muted: #8fa6a2;
    --scrim: rgba(0, 0, 0, .65);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1413;
  --surface: #13201e;
  --surface-2: #182826;
  --ink: #e2ecea;
  --muted: #93a7a3;
  --line: #253532;
  --accent: #3dbdb1;
  --accent-strong: #74d8cd;
  --accent-ink: #052220;
  --accent-soft: #123430;
  --ok: #63c98b;
  --ok-soft: #13301f;
  --warn: #f0b04a;
  --warn-soft: #36280f;
  --bad: #f08a80;
  --bad-soft: #3a1a17;
  --on-bad: #2a0d0a;
  --bar: #08100f;
  --bar-ink: #e2ecea;
  --bar-muted: #8fa6a2;
  --scrim: rgba(0, 0, 0, .65);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.65 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
.min0 { min-width: 0; }
.num { direction: ltr; unicode-bidi: isolate; }
code, .code { font-family: var(--font-mono); font-size: .9em; direction: ltr; unicode-bidi: isolate; letter-spacing: .02em; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.topbar { background: var(--bar); color: var(--bar-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.topbar-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; min-width: 0; }
.brand svg { flex: none; width: 34px; height: 34px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.brand-text strong { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.brand-text small { font-size: 12px; color: var(--bar-muted); }
.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; min-width: 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 8px 12px; border-radius: 8px; color: var(--bar-muted); text-decoration: none; white-space: nowrap; font-weight: 500; }
.tab:hover { color: var(--bar-ink); background: var(--bar-hover); }
.tab[aria-current="page"] { color: var(--bar-ink); background: var(--bar-active); box-shadow: inset 0 -2px 0 var(--bar-accent); }
.lang-btn { background: transparent; border: 1px solid var(--bar-active); color: var(--bar-ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
.lang-btn:hover { background: var(--bar-hover); }
@media (max-width: 900px) {
  .tabs { order: 3; flex-basis: 100%; }
  .lang-btn { margin-inline-start: auto; }
}

/* ---------- page frame ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 22px 56px; padding-inline: 16px; }
@media (min-width: 700px) { .wrap { padding-inline: 24px; } }
.stack { display: flex; flex-direction: column; gap: 20px; }
.h1 { font-size: 26px; font-weight: 700; margin: 0; line-height: 1.3; text-wrap: balance; }
.h2 { font-size: 17px; font-weight: 600; margin: 0; line-height: 1.4; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 68ch; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head-actions, .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .two-col { grid-template-columns: minmax(0, 1fr); } }
#banners:not(:empty) { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.banner { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); }
.banner p { margin: 0; flex: 1 1 260px; }
.banner-warn { background: var(--warn-soft); }
.banner-bad { background: var(--bad-soft); }
.banner-ic { font-weight: 700; width: 22px; height: 22px; flex: none; border-radius: 50%; display: inline-grid; place-items: center; font-size: 13px; background: var(--accent); color: var(--accent-ink); }
.banner-warn .banner-ic { background: var(--warn); color: var(--surface); }
.banner-bad .banner-ic { background: var(--bad); color: var(--on-bad); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; line-height: 1.4; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-primary:disabled { background: var(--accent); border-color: var(--accent); }
.btn-danger { color: var(--bad); }
.btn-danger:hover { border-color: var(--bad); }
.btn-danger-solid { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.btn-danger-solid:hover { border-color: var(--bad); filter: brightness(.95); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--ink); border-color: var(--line); }
.btn-lg { padding: 14px 20px; font-size: 17px; }
.btn-sm { padding: 5px 11px; font-size: 13px; }
.btn-block { width: 100%; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1; display: inline-grid; place-items: center; }
.icon-btn:hover { color: var(--bad); border-color: var(--line); }
.in { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); line-height: 1.4; }
.in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.in.invalid { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.in-num { text-align: center; font-variant-numeric: tabular-nums; direction: ltr; }
textarea.in { resize: vertical; min-height: 64px; }
select.in { cursor: pointer; }
input[type="checkbox"] { accent-color: var(--accent); width: 17px; height: 17px; margin: 0; flex: none; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field-label { font-size: 13px; font-weight: 600; color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.inline { display: flex; gap: 8px; }
.inline .in { flex: 1; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; align-self: flex-start; }
.seg button { border: 0; background: var(--surface); padding: 7px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* ---------- scan box ---------- */
.scanbox { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding-inline: 14px; transition: border-color .15s, box-shadow .15s; }
.scanbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.scanbox svg { width: 30px; height: 24px; color: var(--accent); flex: none; }
.scan-input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 15px 0; font-size: 19px; }
.scan-input:focus-visible { outline: none; }
.scanbox-sm { border-width: 1px; border-radius: 9px; }
.scanbox-sm svg { width: 24px; height: 18px; }
.scanbox-sm .scan-input { padding: 9px 0; font-size: 15px; }

/* ---------- pills, location chips ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px 1px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; line-height: 1.6; }
.pill-ic { font-weight: 700; }
.pill-low { background: var(--warn-soft); color: var(--warn); }
.pill-out, .pill-neg { background: var(--bad-soft); color: var(--bad); }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-muted { background: var(--surface-2); color: var(--muted); }
.qty-cell { display: inline-flex; align-items: center; gap: 8px; }
.qty-cell b { font-variant-numeric: tabular-nums; font-size: 15px; }
.loc-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; font-size: 13px; white-space: nowrap; }
.loc-chip svg { width: 12px; height: 12px; }
.loc-none { color: var(--muted); font-size: 13px; }

/* ---------- home: product card + hits ---------- */
.finder { display: flex; flex-direction: column; gap: 12px; }
.results { display: flex; flex-direction: column; gap: 10px; }
.results:empty { display: none; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
.pcard-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.pcard-name { font-size: 22px; margin: 0; font-weight: 700; line-height: 1.4; text-wrap: balance; }
.pcard-meta { color: var(--muted); font-size: 13.5px; display: flex; gap: 6px 12px; flex-wrap: wrap; }
.pcard-facts { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.fact { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fact-label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.fact-val { font-size: 24px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.fact-loc { background: var(--accent-soft); }
.fact-loc .fact-val { font-size: 30px; color: var(--accent-strong); display: flex; align-items: center; gap: 8px; }
.fact-loc .fact-val svg { width: 22px; height: 22px; flex: none; }
.pcard-actions { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 560px) {
  .pcard-facts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .fact-loc { grid-column: 1 / -1; }
}
.hits { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.hits > li + li { border-top: 1px solid var(--line); }
.hit { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; width: 100%; padding: 11px 16px; border: 0; background: none; text-align: start; cursor: pointer; color: var(--ink); }
.hit:hover { background: var(--surface-2); }
.hit-2 { grid-template-columns: minmax(0, 1fr) auto; }
.cell-name { font-weight: 600; display: block; overflow-wrap: anywhere; }
.cell-sub { font-size: 12.5px; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; }
.msg { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; }
.msg p { margin: 0; flex: 1 1 240px; }
.msg-bad { border-color: var(--bad); border-style: solid; background: var(--bad-soft); }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; text-align: start; color: var(--ink); min-width: 0; }
button.tile { cursor: pointer; font: inherit; }
button.tile:hover { border-color: var(--accent); }
.tile-label { font-size: 13px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tile-value { font-size: 26px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.tile-sub { font-size: 12.5px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot-warn { background: var(--warn); }
.dot-ok { background: var(--ok); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list > li + li { border-top: 1px solid var(--line); }
.list .hit { padding-inline: 2px; }
.empty { color: var(--muted); margin: 0; padding: 6px 0; }
.welcome { gap: 10px; }
.welcome p { margin: 0; max-width: 68ch; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: start; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .num-col { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl-products { min-width: 760px; }
.row-link { cursor: pointer; }
.row-link:hover td { background: var(--surface-2); }
.row-flash td { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.table-foot { display: flex; gap: 6px 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; padding: 4px 2px 0; }
.toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 10px; align-items: center; }
@media (max-width: 860px) { .toolbar { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .toolbar .scanbox { grid-column: 1 / -1; } }
@media (max-width: 420px) { .toolbar { grid-template-columns: minmax(0, 1fr); } }

/* ---------- point of sale ---------- */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
@media (max-width: 920px) { .pos { grid-template-columns: minmax(0, 1fr); } }
.pos-main { display: flex; flex-direction: column; gap: 14px; }
.pos-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 920px) { .pos-side { position: static; } }
.tbl-cart { min-width: 600px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { width: 32px; height: 34px; border: 0; background: var(--surface-2); cursor: pointer; font-size: 17px; font-weight: 600; color: var(--ink); }
.stepper button:hover { background: var(--accent-soft); }
.stepper input { width: 52px; height: 34px; border: 0; border-inline: 1px solid var(--line); text-align: center; background: var(--surface); font-variant-numeric: tabular-nums; }
.stepper input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.price-in { width: 92px; }
.warn-text { color: var(--warn); font-weight: 600; }
.grand { display: flex; flex-direction: column; gap: 0; }
.grand-label { font-size: 13px; color: var(--muted); font-weight: 600; }
.grand-val { font-size: 46px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.side-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13.5px; }
.last-sale { font-size: 13.5px; color: var(--muted); display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; padding-inline: 4px; }

/* ---------- sales ---------- */
.stats-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 640px) { .stats-3 { grid-template-columns: minmax(0, 1fr); } }
.sales-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 920px) { .sales-layout { grid-template-columns: minmax(0, 1fr); } }
.sales-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.sale + .sale { border-top: 1px solid var(--line); }
.sale > summary { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 16px; cursor: pointer; list-style: none; align-items: center; }
.sale > summary::-webkit-details-marker { display: none; }
.sale > summary:hover { background: var(--surface-2); }
.sale-no { font-weight: 700; font-variant-numeric: tabular-nums; }
.sale-when { color: var(--muted); font-size: 13.5px; display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; }
.sale-total { font-weight: 700; text-align: end; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sale-profit { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.sale.is-cancelled .sale-total { text-decoration: line-through; color: var(--muted); }
.sale-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.sale-body .tbl { font-size: 13.5px; border: 1px solid var(--line); border-radius: 8px; }
.sale-note { margin: 0; color: var(--muted); font-size: 13.5px; }
.best { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.best-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.best-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.best-val { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--accent-soft); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* ---------- labels ---------- */
.labels-layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
@media (max-width: 980px) { .labels-layout { grid-template-columns: minmax(0, 1fr); } }
.lbl-list { max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.lbl-row { display: grid; grid-template-columns: auto minmax(0, 1fr) 84px; gap: 12px; align-items: center; padding: 9px 12px; }
.lbl-row + .lbl-row { border-top: 1px solid var(--line); }
.lbl-row label { display: contents; cursor: pointer; }
.lbl-row .in { padding: 6px 8px; }
.lbl-tools { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; }
.preview-box { overflow: auto; direction: ltr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.sheet-zoom .sheet { box-shadow: 0 2px 14px rgba(0, 0, 0, .18); }
.sheet-zoom .label { outline: 1px dashed #c4cfcd; outline-offset: -1px; }

/* paper is always white: label sheets use fixed print colors in both themes */
.sheet { width: 210mm; height: 297mm; display: grid; grid-template-columns: repeat(3, 70mm); grid-template-rows: repeat(8, 37.125mm); background: #fff; color: #000; overflow: hidden; break-after: page; page-break-after: always; direction: ltr; }
.sheet:last-child { break-after: auto; page-break-after: auto; }
.label { padding: 3mm 4mm 2.5mm; display: flex; flex-direction: column; justify-content: center; gap: 1.2mm; overflow: hidden; font-family: var(--font-body); }
.label-name { font-size: 9pt; font-weight: 600; line-height: 1.3; text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.label .barcode { display: block; width: 100%; height: 13mm; }
.label-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 2mm; }
.label-code { font-family: var(--font-mono); font-size: 8.5pt; letter-spacing: .06em; }
.label-price { font-size: 11pt; font-weight: 700; }
#print-root { display: none; }
@page { size: A4; margin: 0; }
@media print {
  html, body { background: #fff !important; }
  #app, #toasts, dialog { display: none !important; }
  #print-root { display: block !important; }
}

/* ---------- stock count, activity, shortcuts ---------- */
.count-place { max-width: 320px; }
kbd { font-family: var(--font-mono); font-size: 11px; font-weight: 500; padding: 0 5px; border: 1px solid currentColor; border-radius: 4px; opacity: .7; line-height: 1.5; }
.act-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; }
.act-list li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 12px; font-size: 13.5px; }
.act-list li + li { border-top: 1px solid var(--line); }
.act-list .cell-sub { display: inline; }
.delta-up { color: var(--ok); }
.delta-down { color: var(--bad); }

/* ---------- tables become cards on phones ---------- */
@media (max-width: 640px) {
  .tbl-cards { min-width: 0; }
  .tbl-cards thead { display: none; }
  .tbl-cards tbody { display: block; }
  .tbl-cards tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .tbl-cards tbody tr:last-child { border-bottom: 0; }
  .tbl-cards td, .tbl-cards tbody tr:last-child td { display: block; padding: 0; border: 0; text-align: start; }
  .tbl-cards td:first-child { grid-column: 1 / -1; }
  .tbl-cards td[data-label]::before { content: attr(data-label); display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
  .tbl-cards .num-col { text-align: start; }
  .tbl-cards .cell-end { justify-self: end; align-self: end; }
  .tbl-cards .row-flash td { animation: none; }
  .tbl-cards tr.row-flash { animation: flash 1.2s ease-out; }
}
/* No physical keyboard on touch screens, so hide the shortcut hints */
@media (hover: none) { kbd { display: none; } }

/* ---------- settings ---------- */
.settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .settings-grid { grid-template-columns: minmax(0, 1fr); } }
.tips { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 8px; }
.panel p { margin: 0; }
.panel h3 { margin: 6px 0 0; font-size: 15px; }

/* ---------- dialogs & toasts ---------- */
dialog { border: 0; padding: 0; border-radius: 14px; background: var(--surface); color: var(--ink); width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 24px); box-shadow: 0 24px 70px rgba(0, 0, 0, .35); }
dialog::backdrop { background: var(--scrim); }
.dlg-small { width: min(440px, calc(100vw - 24px)); }
.dlg-form { display: flex; flex-direction: column; max-height: calc(100vh - 24px); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.dlg-body { padding: 18px 20px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.dlg-foot { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
.form-err { color: var(--bad); font-weight: 600; margin: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.form-err:empty { display: none; }
.confirm-msg { margin: 0; font-size: 16px; white-space: pre-line; }
#toasts { position: fixed; inset-inline: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 100; padding-inline: 16px; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 600; box-shadow: var(--shadow); max-width: 560px; transition: opacity .3s, transform .3s; }
.toast-bad { background: var(--bad); color: var(--on-bad); }
.toast.out { opacity: 0; transform: translateY(8px); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

let lang = 'ar';
function t(key, vars) {
  let s = (STR[lang] && STR[lang][key]) ?? STR.en[key] ?? key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] ?? m));
  return s;
}

const APP_ID = 'stock-book';
const DB_NAME = 'stock-book-db';
const NAV = ['home', 'sell', 'products', 'receive', 'count', 'sales', 'labels', 'settings'];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const nowISO = () => new Date().toISOString();
const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function normDigits(s) {
  return String(s ?? '')
    .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x660))
    .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x6F0));
}
// French (AZERTY) keyboards turn scanned digits into these symbols
const AZERTY = { '&': '1', 'é': '2', '"': '3', "'": '4', '(': '5', '-': '6', 'è': '7', '_': '8', 'ç': '9', 'à': '0' };
function normCode(s) {
  let v = normDigits(s).trim();
  if (v && [...v].every(c => c in AZERTY)) v = [...v].map(c => AZERTY[c]).join('');
  return v;
}
const looksLikeCode = c => /^[0-9A-Za-z.\-]{4,}$/.test(c) && /\d/.test(c);
function normText(s) {
  return normDigits(s).toLowerCase()
    .replace(/[ً-ْٰـ]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي');
}
function parseNum(s) {
  let v = normDigits(s).replace(/[\s٬]/g, '').replace(/٫/g, '.');
  if (v === '') return null;
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(v)) v = v.replace(/,/g, '');
  else v = v.replace(',', '.');
  const n = Number(v);
  return Number.isFinite(n) ? n : NaN;
}
function fmtNum(n) {
  const v = round2(n);
  return v.toLocaleString('en-US', Number.isInteger(v) ? {} : { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function money(n) {
  const s = fmtNum(n);
  const c = ((state && state.settings.currency) || '').trim();
  if (!c) return s;
  return [...c].length === 1 ? c + s : s + ' ' + c;
}
const moneyH = n => `<span class="num">${esc(money(n))}</span>`;
const numH = n => `<span class="num">${esc(fmtNum(n))}</span>`;
const locale = () => (lang === 'ar' ? 'ar-u-nu-latn' : 'en-GB');
const fmtDateTime = iso => new Intl.DateTimeFormat(locale(), { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(iso));
const fmtDate = iso => new Intl.DateTimeFormat(locale(), { dateStyle: 'medium' }).format(new Date(iso));
const fmtTime = iso => new Intl.DateTimeFormat(locale(), { timeStyle: 'short' }).format(new Date(iso));
const isToday = iso => new Date(iso).toDateString() === new Date().toDateString();
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ================= Code 128 barcodes ================= */
const C128 = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128Values(text) {
  const vals = [];
  if (/^\d+$/.test(text) && text.length % 2 === 0) {
    vals.push(105);
    for (let i = 0; i < text.length; i += 2) vals.push(Number(text.slice(i, i + 2)));
  } else {
    vals.push(104);
    for (const ch of text) {
      const c = ch.charCodeAt(0);
      if (ch.length !== 1 || c < 32 || c > 126) throw new Error('unsupported character');
      vals.push(c - 32);
    }
  }
  let check = vals[0];
  for (let i = 1; i < vals.length; i++) check += vals[i] * i;
  vals.push(check % 103, 106);
  return vals;
}
function barcodeSVG(text, height = 40) {
  const vals = code128Values(text);
  let x = 10;
  let bars = '';
  for (const v of vals) {
    const pat = C128[v];
    for (let k = 0; k < pat.length; k++) {
      const w = Number(pat[k]);
      if (k % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="${height}"/>`;
      x += w;
    }
  }
  const total = x + 10;
  return `<svg class="barcode" viewBox="0 0 ${total} ${height}" preserveAspectRatio="none" shape-rendering="crispEdges" role="img" aria-label="${esc(text)}"><rect width="${total}" height="${height}" fill="#fff"/><g fill="#000">${bars}</g></svg>`;
}

const DEFAULT_SETTINGS = { storeName: '', currency: '$', lowDefault: 2, sound: true, lang: 'ar', nextCode: 1, nextSaleNo: 1, lastBackupAt: null };
let state = null;
let storageMode = 'memory'; // 'idb' | 'local' | 'memory'
let db = null;
let lastSavedRev = 0;
let saveChain = Promise.resolve();

const num0 = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const str = v => (v === null || v === undefined ? '' : String(v));
const int0 = v => Math.round(num0(v));
function isoOrNull(v) {
  if (!v) return null;
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? null : d.toISOString();
}
const arr = v => (Array.isArray(v) ? v : []);
function normItems(items) {
  return arr(items).filter(i => i && typeof i === 'object').map(i => ({
    pid: str(i.pid), name: str(i.name), barcode: str(i.barcode),
    qty: Math.max(0, int0(i.qty)), price: round2(num0(i.price)), cost: round2(num0(i.cost)),
    returned: Math.max(0, int0(i.returned))
  }));
}
// Rebuilds everything with known types, so a damaged or hand-edited backup cannot break the pages
function normalizeState(s) {
  s = s && typeof s === 'object' ? s : {};
  const st = { ...DEFAULT_SETTINGS, ...(s.settings && typeof s.settings === 'object' ? s.settings : {}) };
  const out = {
    app: APP_ID, version: 1, rev: Number(s.rev) || 0,
    settings: {
      storeName: str(st.storeName), currency: str(st.currency),
      lowDefault: Math.max(0, int0(st.lowDefault)), sound: st.sound !== false, lang: st.lang === 'en' ? 'en' : 'ar',
      nextCode: Math.max(1, int0(st.nextCode)), nextSaleNo: Math.max(1, int0(st.nextSaleNo)),
      lastBackupAt: isoOrNull(st.lastBackupAt)
    },
    products: [],
    sales: arr(s.sales).filter(x => x && isoOrNull(x.date)).map(x => ({
      id: str(x.id) || uid(), no: Math.max(0, int0(x.no)), date: isoOrNull(x.date), items: normItems(x.items),
      total: round2(num0(x.total)), profit: round2(num0(x.profit)), note: str(x.note),
      cancelled: !!x.cancelled, cancelledAt: isoOrNull(x.cancelledAt), sample: !!x.sample
    })),
    stockIns: arr(s.stockIns).filter(x => x && isoOrNull(x.date)).map(x => ({
      id: str(x.id) || uid(), date: isoOrNull(x.date), items: normItems(x.items), note: str(x.note), sample: !!x.sample
    })),
    // Stock counts and single-item returns, kept for each product's activity list
    adjustments: arr(s.adjustments).filter(x => x && isoOrNull(x.date)).map(x => ({
      id: str(x.id) || uid(), date: isoOrNull(x.date), kind: x.kind === 'return' ? 'return' : 'count',
      note: str(x.note), saleNo: Math.max(0, int0(x.saleNo)), counted: Math.max(0, int0(x.counted)), sample: !!x.sample,
      items: arr(x.items).filter(i => i && typeof i === 'object').map(i => ({ pid: str(i.pid), name: str(i.name), from: int0(i.from), to: int0(i.to), qty: Math.max(0, int0(i.qty)) }))
    })),
    countDraft: (() => {
      const cd = s.countDraft && typeof s.countDraft === 'object' ? s.countDraft : {};
      return { location: str(cd.location), lines: arr(cd.lines).filter(l => l && l.pid).map(l => ({ pid: str(l.pid), n: Math.max(0, int0(l.n)) })) };
    })()
  };
  for (const p of arr(s.products)) {
    if (!p || !p.id) continue;
    out.products.push({
      id: str(p.id), name: str(p.name), barcode: str(p.barcode),
      category: str(p.category), location: str(p.location),
      cost: round2(num0(p.cost)), price: round2(num0(p.price)),
      qty: int0(p.qty), minQty: Math.max(0, int0(p.minQty)),
      notes: str(p.notes), gen: !!p.gen, sample: !!p.sample,
      createdAt: isoOrNull(p.createdAt), updatedAt: isoOrNull(p.updatedAt)
    });
  }
  return out;
}

function openDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error('no indexedDB'));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('blocked'));
  });
}
function loadStored() {
  if (storageMode === 'idb') {
    return new Promise((resolve, reject) => {
      const req = db.transaction('kv', 'readonly').objectStore('kv').get('state');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  if (storageMode === 'local') {
    const raw = localStorage.getItem(DB_NAME);
    return Promise.resolve(raw ? JSON.parse(raw) : null);
  }
  return Promise.resolve(null);
}
// Writes only if nobody else saved since our last load/save; otherwise reports a conflict.
function writeStored(snapshot, expectRev) {
  if (storageMode === 'idb') {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      const os = tx.objectStore('kv');
      let result = 'conflict';
      const g = os.get('state');
      g.onsuccess = () => {
        const cur = g.result;
        if (cur && (Number(cur.rev) || 0) !== expectRev) return;
        result = snapshot.rev;
        os.put(snapshot, 'state');
      };
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('aborted'));
    });
  }
  if (storageMode === 'local') {
    const raw = localStorage.getItem(DB_NAME);
    const cur = raw ? JSON.parse(raw) : null;
    if (cur && (Number(cur.rev) || 0) !== expectRev) return Promise.resolve('conflict');
    localStorage.setItem(DB_NAME, JSON.stringify(snapshot));
    return Promise.resolve(snapshot.rev);
  }
  return Promise.resolve(snapshot.rev);
}
async function doSave() {
  if (state.rev === lastSavedRev) return;
  const res = await writeStored(state, lastSavedRev);
  if (res === 'conflict') {
    const stored = await loadStored();
    state = normalizeState(stored);
    lastSavedRev = state.rev;
    renderAll();
    toast(t('conflict'), 'bad');
    return;
  }
  lastSavedRev = res;
}
function queueSave() {
  saveChain = saveChain.then(doSave).catch(err => { console.error(err); toast(t('save_failed'), 'bad'); });
}
function commit() {
  state.rev++;
  queueSave();
  refreshUI();
}
// Saves without redrawing, for edits made while the person is still typing in a table
function commitQuiet() {
  state.rev++;
  queueSave();
}
async function syncFromStorage() {
  if (storageMode === 'memory' || state.rev !== lastSavedRev) return;
  const stored = await loadStored();
  if (stored && (Number(stored.rev) || 0) !== lastSavedRev) {
    state = normalizeState(stored);
    lastSavedRev = state.rev;
    renderAll();
  }
}

/* ================= Product helpers ================= */
const getP = id => state.products.find(p => p.id === id);
function findByBarcode(code) {
  if (!code) return null;
  let p = state.products.find(x => x.barcode === code);
  if (!p && /^\d+$/.test(code)) {
    const c = code.replace(/^0+/, '');
    p = state.products.find(x => /^\d+$/.test(x.barcode) && x.barcode.replace(/^0+/, '') === c);
  }
  if (!p) {
    const lc = code.toLowerCase();
    p = state.products.find(x => x.barcode.toLowerCase() === lc);
  }
  return p || null;
}
function searchProducts(q) {
  const tokens = normText(q).split(/\s+/).filter(Boolean);
  if (!tokens.length) return [];
  const first = tokens[0];
  return state.products
    .filter(p => {
      const hay = normText([p.name, p.barcode, p.category, p.location, p.notes].join(' '));
      return tokens.every(tk => hay.includes(tk));
    })
    .sort((a, b) => (normText(b.name).startsWith(first) - normText(a.name).startsWith(first)) || a.name.localeCompare(b.name, lang));
}
function stockState(p) {
  if (p.qty < 0) return 'neg';
  if (p.qty === 0) return 'out';
  if (p.qty <= p.minQty) return 'low';
  return 'ok';
}
function stockPill(p) {
  const s = stockState(p);
  if (s === 'ok') return '';
  const icon = { low: '!', out: '×', neg: '?' }[s];
  return `<span class="pill pill-${s}"><span class="pill-ic" aria-hidden="true">${icon}</span>${esc(t('st_' + s))}</span>`;
}
const qtyCell = p => `<span class="qty-cell"><b class="num">${p.qty}</b>${stockPill(p)}</span>`;
const locChip = p => p.location
  ? `<span class="loc-chip">${ICON_PIN}${esc(p.location)}</span>`
  : `<span class="loc-none">${esc(t('noLocation'))}</span>`;
function nextGenCode() {
  let n = state.settings.nextCode || 1;
  let code;
  do { code = '20' + String(n).padStart(6, '0'); n++; } while (findByBarcode(code));
  return code;
}
const uniq = arr => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b, lang));

/* ================= Sound ================= */
let audioCtx = null;
function beep(ok = true) {
  if (!state.settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const tm = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = ok ? 'sine' : 'square';
    o.frequency.value = ok ? 1400 : 220;
    const dur = ok ? 0.09 : 0.28;
    g.gain.setValueAtTime(0.0001, tm);
    g.gain.exponentialRampToValueAtTime(ok ? 0.12 : 0.06, tm + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, tm + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(tm); o.stop(tm + dur + 0.02);
  } catch (e) { /* sound is optional */ }
}

/* ================= Toasts & confirm ================= */
function toast(msg, kind = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'bad' ? ' toast-bad' : '');
  el.textContent = msg;
  const box = $('#toasts');
  while (box.children.length >= 3) box.firstElementChild.remove();
  box.append(el);
  setTimeout(() => el.classList.add('out'), 3400);
  setTimeout(() => el.remove(), 3800);
}
function confirmBox(msg, { okText, danger } = {}) {
  return new Promise(resolve => {
    const d = $('#dlg-confirm');
    let done = false;
    const finish = v => { if (done) return; done = true; if (d.open) d.close(); resolve(v); };
    d.innerHTML = `<div class="dlg-form"><div class="dlg-body"><p class="confirm-msg">${esc(msg)}</p></div>
      <footer class="dlg-foot"><span class="spacer"></span>
      <button type="button" class="btn" data-r="0">${esc(t('cancel'))}</button>
      <button type="button" class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}" data-r="1">${esc(okText || t('save'))}</button></footer></div>`;
    d.onclick = e => { const b = e.target.closest('[data-r]'); if (b) finish(b.dataset.r === '1'); };
    d.oncancel = e => { e.preventDefault(); finish(false); };
    d.showModal();
    $('[data-r="0"]', d).focus();
  });
}

/* ================= Copy to clipboard ================= */
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); return; } catch (e) { /* fall back below */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.append(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  toast(ok ? okMsg : t('copy_failed'), ok ? 'ok' : 'bad');
}
function receiptText(s) {
  const out = [];
  const name = state.settings.storeName.trim();
  if (name) out.push(name);
  out.push(`${t('receipt_title', { no: s.no })} · ${fmtDateTime(s.date)}`);
  out.push('------------------------');
  for (const i of s.items) if (i.qty > 0) out.push(`${i.name} × ${i.qty} = ${money(i.qty * i.price)}`);
  out.push('------------------------');
  out.push(`${t('total')}: ${money(s.total)}`);
  out.push(t('receipt_thanks'));
  return out.join('\n');
}
function orderListText() {
  const low = state.products.filter(p => stockState(p) !== 'ok').sort((a, b) => a.qty - b.qty || a.name.localeCompare(b.name, lang));
  const out = [];
  const name = state.settings.storeName.trim();
  out.push((name ? name + ' · ' : '') + t('order_title') + ' · ' + fmtDate(nowISO()));
  for (const p of low) out.push('- ' + t('order_line', { name: p.name, n: p.qty }));
  return out.join('\n');
}

    <button type="button" class="btn btn-primary" data-action="${action}" data-code="${esc(code)}">${esc(t('addAsNew'))}</button></div>`;
}
function renderHomeResults() {
  const el = $('#home-results'); if (!el) return;
  const hit = ui.homeHit;
  if (hit && hit.type === 'product') {
    const p = getP(hit.id);
    if (p) { el.innerHTML = productCard(p); return; }
    ui.homeHit = null;
  }
  if (hit && hit.type === 'notfound') { el.innerHTML = notFoundMsg(hit.code, 'new-with-code'); return; }
  const q = ui.homeQuery.trim();
  if (!q) { el.innerHTML = ''; return; }
  const m = searchProducts(q);
  if (!m.length) { el.innerHTML = `<div class="msg"><p>${esc(t('noResults', { q }))}</p>${looksLikeCode(normCode(q)) ? `<button type="button" class="btn" data-action="new-with-code" data-code="${esc(normCode(q))}">${esc(t('addAsNew'))}</button>` : ''}</div>`; return; }
  if (m.length === 1) { el.innerHTML = productCard(m[0]); return; }
  el.innerHTML = `<ul class="hits">${m.slice(0, 8).map(p => hitRow(p, 'show-product')).join('')}</ul>${m.length > 8 ? `<p class="hint">${esc(t('moreResults', { n: m.length - 8 }))}</p>` : ''}`;
}
function backupReminder() {
  if (!state.products.some(p => !p.sample)) return '';
  const last = state.settings.lastBackupAt;
  const btn = `<button type="button" class="btn btn-sm" data-action="backup">${esc(t('backup_now'))}</button>`;
  if (!last) return banner('warn', t('backup_never'), btn);
  if (Date.now() - new Date(last).getTime() > 7 * 864e5) return banner('warn', t('backup_old', { date: fmtDate(last) }), btn);
  return '';
}
function tile(label, value, sub, extra = {}) {
  const tag = extra.action ? 'button' : 'div';

}

function homeEnter(input) {

function addToCart(p) {
  const i = ui.cart.findIndex(l => l.pid === p.id);
  if (i >= 0) { const [line] = ui.cart.splice(i, 1); line.qty++; ui.cart.unshift(line); }
  else ui.cart.unshift({ pid: p.id, qty: 1, price: p.price });
  ui.sellMsg = null;
  ui.flashPid = p.id;
  renderSellMsg(); renderCart(); renderSellTotals();
}
function sellEnter(input) {
  const raw = input.value;
  const code = normCode(raw);
  if (!code) return;
  let p = findByBarcode(code);
  if (!p) {
    const m = searchProducts(raw);
    if (m.length === 1) p = m[0];
    else if (m.length > 1) { ui.sellMsg = { type: 'pick', ids: m.slice(0, 8).map(x => x.id) }; renderSellMsg(); return; }
    else { ui.sellMsg = { type: 'notfound', code: looksLikeCode(code) ? code : null, q: raw }; beep(false); renderSellMsg(); input.select(); return; }
  }

  input.value = '';
}
function completeSale() {
  const items = [];
  for (const l of ui.cart) {
    const p = getP(l.pid);
    if (!p || l.qty <= 0) continue;
    items.push({ pid: p.id, name: p.name, barcode: p.barcode, qty: l.qty, price: round2(l.price), cost: round2(p.cost) });
  }
  if (!items.length) return;
  const date = nowISO();
  const sale = {
    id: uid(), no: state.settings.nextSaleNo++, date, items,
    total: round2(sum(items, i => i.qty * i.price)),
    profit: round2(sum(items, i => i.qty * (i.price - i.cost))),
    note: ui.sellNote.trim()
  };
  for (const i of items) { const p = getP(i.pid); p.qty -= i.qty; p.updatedAt = date; }
  state.sales.push(sale);
  ui.cart = []; ui.sellNote = ''; ui.sellMsg = null;
  const note = $('#sell-note'); if (note) note.value = '';
  commit();
  toast(t('sale_done', { no: sale.no, total: money(sale.total) }));
  focusScan();
}
async function returnItem(id, k) {
  const s = state.sales.find(x => x.id === id);
  const line = s && s.items[k];
  if (!line || s.cancelled || line.qty < 1) return;
  if (!await confirmBox(t('return_confirm', { name: line.name, v: money(line.price), no: s.no }), { okText: t('return_one') })) return;
  const cur = state.sales.find(x => x.id === id);
  const l = cur && cur.items[k];
  if (!l || cur.cancelled || l.qty < 1) return;
  l.qty -= 1;
  l.returned = (l.returned || 0) + 1;
  const p = getP(l.pid);
  if (p) { p.qty += 1; p.updatedAt = nowISO(); }
  cur.total = round2(sum(cur.items, i => i.qty * i.price));
  cur.profit = round2(sum(cur.items, i => i.qty * (i.price - i.cost)));
  if (cur.items.every(i => i.qty === 0)) { cur.cancelled = true; cur.cancelledAt = nowISO(); }
  state.adjustments.push({ id: uid(), date: nowISO(), kind: 'return', saleNo: cur.no, note: '', counted: 0, sample: !!cur.sample, items: [{ pid: l.pid, name: l.name, from: 0, to: 0, qty: 1 }] });
  ui.openSale = cur.id;
  commit();
  toast(t('return_done', { name: l.name }));
}
async function cancelSale(id) {
  const s = state.sales.find(x => x.id === id);
  if (!s || s.cancelled) return;
  if (!await confirmBox(t('cancel_confirm', { no: s.no }), { okText: t('cancel_sale'), danger: true })) return;
  const cur = state.sales.find(x => x.id === id);
  if (!cur || cur.cancelled) return;
  cur.cancelled = true;
  cur.cancelledAt = nowISO();
  for (const i of cur.items) { const p = getP(i.pid); if (p) p.qty += i.qty; }
  commit();
  toast(t('sale_cancelled', { no: cur.no }));
}

// Reads a CSV saved by Excel: UTF-8 or the older Arabic Windows encoding, comma or semicolon separated
async function readCSVFile(file) {
  const buf = await file.arrayBuffer();
  let text;
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { text = new TextDecoder('windows-1256').decode(buf); }
  text = text.replace(/^\ufeff/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const delim = first.split(';').length > first.split(',').length ? ';' : (first.includes('\t') && !first.includes(',') ? '\t' : ',');
  const rows = [];
  let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}
const IMPORT_COLS = {
  name: ['الاسم', 'اسم المنتج', 'المنتج', 'name', 'product', 'product name'],
  barcode: ['الباركود', 'باركود', 'barcode', 'code', 'ean', 'upc'],
  category: ['الفئة', 'الصنف', 'category'],
  location: ['المكان', 'الرف', 'location', 'shelf'],
  qty: ['الكمية', 'quantity', 'qty', 'stock'],
  cost: ['سعر الشراء', 'التكلفة', 'cost', 'cost price'],
  price: ['سعر البيع', 'السعر', 'price', 'selling price'],
  minQty: ['حد التنبيه', 'warn at', 'min', 'minimum'],
  notes: ['ملاحظات', 'notes', 'note']
};
const IMPORT_ORDER = ['name', 'barcode', 'category', 'location', 'qty', 'cost', 'price', 'minQty', 'notes'];
async function importProducts(file) {
  let rows;
  try { rows = await readCSVFile(file); } catch (e) { toast(t('import_bad'), 'bad'); return; }
  if (!rows.length) { toast(t('import_bad'), 'bad'); return; }
  // Columns by header name (Arabic or English), or in the export file's order when there is no header
  const head = rows[0].map(h => normText(h).trim());
  const colOf = {};
  for (const [key, names] of Object.entries(IMPORT_COLS)) {
    const i = head.findIndex(h => names.some(n => normText(n) === h));
    if (i >= 0) colOf[key] = i;
  }
  const hasHeader = colOf.name !== undefined || colOf.barcode !== undefined;
  if (!hasHeader) IMPORT_ORDER.forEach((k, i) => { colOf[k] = i; });
  const data = hasHeader ? rows.slice(1) : rows;
  const cell = (r, k) => (colOf[k] === undefined ? '' : String(r[colOf[k]] ?? '').trim());
  const plan = [];
  const seen = new Set();
  let skipped = 0, sci = 0;
  for (const r of data) {
    const raw = cell(r, 'barcode').replace(/^="?|"$/g, '');
    if (/^\d+([.,]\d+)?e\+?\d+$/i.test(raw)) { sci++; continue; }
    const code = normCode(raw);
    if (code && !/^[\x21-\x7e]+$/.test(code)) { skipped++; continue; }
    const name = cell(r, 'name');
    const existing = code ? findByBarcode(code) : null;
    const isUpdate = !!existing || (code && seen.has(code));
    if (!name && !isUpdate) { skipped++; continue; }
    if (code) seen.add(code);
    const nums = {};
    for (const k of ['qty', 'cost', 'price', 'minQty']) {
      const n = parseNum(cell(r, k));
      if (n !== null && Number.isFinite(n) && (k === 'qty' || n >= 0)) nums[k] = k === 'qty' || k === 'minQty' ? Math.round(n) : round2(n);
    }
    plan.push({ code, update: isUpdate, fields: { name, category: cell(r, 'category'), location: cell(r, 'location'), notes: cell(r, 'notes'), ...nums } });
  }
  const adds = plan.filter(x => !x.update).length;
  const ups = plan.length - adds;
  if (!plan.length) { toast(sci ? t('import_sci', { n: sci }) : t('import_none'), 'bad'); return; }
  const msg = t('import_confirm', { a: adds, u: ups, s: skipped + sci }) + (sci ? '\n\n' + t('import_sci', { n: sci }) : '');
  if (!await confirmBox(msg, { okText: t('import_ok') })) return;
  const now = nowISO();
  for (const row of plan) {
    const f = row.fields;
    const target = row.code ? findByBarcode(row.code) : null;
    if (target) {
      // Only overwrite what the file actually fills in
      for (const k of ['name', 'category', 'location', 'notes']) if (f[k]) target[k] = f[k];
      for (const k of ['qty', 'cost', 'price', 'minQty']) if (f[k] !== undefined) target[k] = f[k];
      target.updatedAt = now;
    } else {
      let code = row.code, gen = false;
      if (!code) { code = nextGenCode(); gen = true; state.settings.nextCode = Number(code.slice(2)) + 1; }
      state.products.push({
        id: uid(), name: f.name, barcode: code, gen, category: f.category, location: f.location,
        cost: f.cost ?? 0, price: f.price ?? 0, qty: f.qty ?? 0, minQty: f.minQty ?? state.settings.lowDefault,
        notes: f.notes, sample: false, createdAt: now, updatedAt: now
      });
    }
  }
  commit();
  toast(t('import_done', { a: adds, u: ups }));
}

function buildSheets() {
  const L = ui.labels;
  const cells = [];
  for (let i = 0; i < Math.min(23, Math.max(0, L.skip | 0)); i++) cells.push('<div class="label"></div>');
  let count = 0;
  for (const [id, n] of L.sel) {
    const p = getP(id); if (!p || !n) continue;
    const html = labelHTML(p, L.showPrice);
    for (let i = 0; i < n; i++) { cells.push(html); count++; }
  }
  const sheets = [];
  for (let i = 0; i < cells.length; i += 24) sheets.push(`<div class="sheet">${cells.slice(i, i + 24).join('')}</div>`);
  return { sheets, count };
}

  const el = $('#lbl-summary'); if (!el) return;

  $('#lbl-print').disabled = !count;
  if (!count) { el.textContent = ''; $('#lbl-preview').innerHTML = `<p class="empty">${esc(t('labels_none'))}</p>`; return; }
  el.textContent = t('labels_summary', { n: count, p: sheets.length });
  $('#lbl-preview').innerHTML = `<p class="hint">${esc(t('labels_preview'))}</p><div class="preview-box"><div class="sheet-zoom">${sheets[0]}</div></div>${sheets.length > 1 ? `<p class="hint">${esc(t('labels_more', { n: sheets.length - 1 }))}</p>` : ''}`;

}

}

  const ok = await confirmBox(t('restore_confirm', { a: state.products.length, date: isoOrNull(obj.exportedAt) ? fmtDateTime(obj.exportedAt) : '?', b: obj.data.products.length }), { okText: t('restore_ok'), danger: true });

  state = incoming;
  ui.cart = []; ui.recv = []; ui.labels.sel.clear(); ui.homeHit = null; ui.countMsg = null;

    commit();
    toast(t('saved', { name }));
    if (andNext) { openProductDialog(null, { category: fields.category, location: fields.location }); return; }
    d.close();
    if (opts.onSaved) opts.onSaved(target);
  };
  d.onclick = async e => {
    const b = e.target.closest('[data-pf]'); if (!b) return;
    const act = b.dataset.pf;
    if (act === 'close') d.close();
    else if (act === 'gen') { genValue = nextGenCode(); $('#pf-barcode', d).value = genValue; err.textContent = ''; $('#pf-name', d).focus(); }
    else if (act === 'save') save(false);
    else if (act === 'save-next') save(true);
    else if (act === 'open-other') { const o = getP(b.dataset.id); if (o) openProductDialog(o); }
    else if (act === 'label') {
      const cur = getP(pid); d.close();
      if (cur) { ui.labels.sel.set(cur.id, defaultCopies(cur)); go('labels'); }
    }
    else if (act === 'delete') {
      const cur = getP(pid); if (!cur) { d.close(); return; }
      if (!await confirmBox(t('del_confirm', { name: cur.name }), { okText: t('pf_delete'), danger: true })) return;
      state.products = state.products.filter(x => x.id !== pid);
      ui.cart = ui.cart.filter(l => l.pid !== pid);
      ui.recv = ui.recv.filter(l => l.pid !== pid);
      ui.labels.sel.delete(pid);
      if (ui.homeHit && ui.homeHit.id === pid) ui.homeHit = null;
      d.close();
      commit();
      toast(t('deleted'));
    }
  };
  form.addEventListener('submit', e => e.preventDefault());
  form.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const tg = e.target;
    if (tg.tagName === 'BUTTON') return;
    if (e.ctrlKey) { e.preventDefault(); save(false); return; }
    if (tg.tagName === 'TEXTAREA') return;
    if (tg.id === 'pf-barcode') {
      if (!checkBarcode()) { e.preventDefault(); return; }
      err.textContent = '';
    }
    const fields = $$('input.in, textarea.in', d);
    const next = fields[fields.indexOf(tg) + 1];
    if (!next) return;
    // Category and location have a suggestion list: let Chrome finish picking a suggestion before moving on
    if (tg.hasAttribute('list')) setTimeout(() => next.focus(), 0);
    else { e.preventDefault(); next.focus(); }
  });
  if (!d.open) d.showModal();
  const first = isNew && !v.barcode ? $('#pf-barcode', d) : $('#pf-name', d);
  first.focus();
  if (!isNew) first.select();
}

function loadSample() {
  const rows = [
    ['ماوس Logitech M185 لاسلكي', 'ماوس', 'رف A1', 9, 14, 12, 3],
    ['ماوس ألعاب Redragon M711', 'ماوس', 'رف A1', 12, 19, 3, 3],
    ['كيبورد Logitech K120 سلكي', 'كيبورد', 'رف A2', 8, 13, 15, 3],
    ['كيبورد ميكانيكي Redragon K552', 'كيبورد', 'رف A2', 28, 39, 2, 2],
    ['سماعة رأس HyperX Cloud Stinger', 'سماعات', 'رف B1', 30, 45, 0, 2],
    ['كيبل HDMI طول 1.5 متر', 'كيبلات', 'درج C3', 1.5, 4, 40, 10],
    ['فلاشة SanDisk سعة 64GB', 'تخزين', 'الواجهة الزجاجية', 5, 8, 25, 5],
    ['قارئ بطاقات USB', 'إكسسوارات', 'درج C1', 2, 5, 9, 3],
    ['لوحة ماوس كبيرة 80×30 سم', 'إكسسوارات', 'رف A3', 3, 7, 18, 4],
    ['كاميرا ويب Logitech C270', 'كاميرات', 'رف B2', 18, 27, 3, 2],
    ['موزع USB بأربعة منافذ', 'إكسسوارات', 'درج C1', 3, 7, 7, 3],
    ['شاحن لابتوب عام 90W', 'شواحن', 'المخزن الخلفي', 9, 16, 6, 2]
  ];
  const now = Date.now();
  const made = rows.map(([name, category, location, cost, price, qty, minQty], i) => {
    const code = nextGenCode();
    state.settings.nextCode = Number(code.slice(2)) + 1;
    const p = { id: uid() + i, name, barcode: code, gen: true, category, location, cost, price, qty, minQty, notes: '', sample: true, createdAt: new Date(now - (rows.length - i) * 6e4).toISOString(), updatedAt: null };
    state.products.push(p);
    return p;
  });
  const mkSale = (daysAgo, h, m, lines) => {
    const d = new Date(); d.setDate(d.getDate() - daysAgo); d.setHours(h, m, 0, 0);
    if (d.getTime() > now) d.setTime(now - 5 * 6e4);
    const items = lines.map(([idx, qty]) => { const p = made[idx]; return { pid: p.id, name: p.name, barcode: p.barcode, qty, price: p.price, cost: p.cost }; });
    state.sales.push({ id: uid(), no: state.settings.nextSaleNo++, date: d.toISOString(), items, total: round2(sum(items, x => x.qty * x.price)), profit: round2(sum(items, x => x.qty * (x.price - x.cost))), note: '', sample: true });
  };
  mkSale(4, 11, 20, [[0, 1], [5, 2]]);
  mkSale(3, 17, 5, [[2, 1]]);
  mkSale(2, 12, 40, [[6, 3]]);
  mkSale(1, 16, 15, [[3, 1], [8, 1]]);
  mkSale(1, 19, 30, [[9, 1]]);
  mkSale(0, 10, 5, [[0, 2], [7, 1]]);
  mkSale(0, 11, 45, [[5, 3]]);
  mkSale(0, 13, 10, [[1, 1], [8, 1]]);
  state.sales.sort((a, b) => a.date.localeCompare(b.date));
  state.sales.forEach((s, i) => { s.no = i + 1; });
  state.settings.nextSaleNo = state.sales.length + 1;
  commit();
  toast(t('sample_loaded'));
}
async function removeSample() {
  if (!await confirmBox(t('sample_confirm'), { okText: t('sample_remove'), danger: true })) return;
  const ids = new Set(state.products.filter(p => p.sample).map(p => p.id));
  const touches = r => r.sample || r.items.some(i => ids.has(i.pid));
  state.products = state.products.filter(p => !p.sample);
  state.sales = state.sales.filter(s => !touches(s));
  state.stockIns = state.stockIns.filter(s => !touches(s));
  state.adjustments = state.adjustments.filter(s => !touches(s));
  state.countDraft.lines = state.countDraft.lines.filter(l => !ids.has(l.pid));
  if (!state.sales.length) state.settings.nextSaleNo = 1;
  if (!state.products.length) state.settings.nextCode = 1;
  ui.cart = ui.cart.filter(l => !ids.has(l.pid));
  ui.recv = ui.recv.filter(l => !ids.has(l.pid));
  for (const id of ids) ui.labels.sel.delete(id);
  ui.homeHit = null; ui.homeQuery = '';
  commit();
  if (ui.view === 'home') mountView();
  toast(t('sample_removed'));
}

};
function setLang(l) {
  if (l !== 'ar' && l !== 'en') return;
  state.settings.lang = l;
  state.rev++; queueSave();
  renderAll();
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (!a || !$('#app').contains(a)) return;
  const fn = actions[a.dataset.action];
  if (!fn) return;
  if (a.tagName !== 'LABEL') e.preventDefault();
  fn(a, e);
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && !e.isComposing && el.id) {
    const map = { 'home-q': homeEnter, 'sell-scan': sellEnter, 'recv-scan': recvEnter, 'count-scan': countEnter, 'prod-q': prodEnter, 'lbl-q': lblEnter };
    if (map[el.id]) { e.preventDefault(); map[el.id](el); return; }
  }
  if (e.key === 'Enter' && el.matches && el.matches('label[data-action="file-pick"]')) { const f = document.getElementById(el.htmlFor); if (f) f.click(); return; }
  // Counter shortcuts: F9 finishes the sale / delivery / count, F2 jumps to the scan box, Esc clears it
  if (!document.querySelector('dialog[open]')) {
    if (e.key === 'F9') {
      const fin = { sell: completeSale, receive: submitRecv, count: applyCount }[ui.view];
      if (fin) { e.preventDefault(); fin(); }
      return;
    }
    if (e.key === 'F2') { e.preventDefault(); focusScan(); return; }
    if (e.key === 'Escape' && el.classList && el.classList.contains('scan-input')) {
      el.value = '';
      ui.sellMsg = ui.recvMsg = ui.countMsg = null;
      if (el.id === 'home-q') { ui.homeQuery = ''; ui.homeHit = null; }
      if (el.id === 'prod-q') { ui.prod.q = ''; ui.prod.msg = null; }
      if (el.id === 'lbl-q') ui.labels.q = '';
      refreshUI();
      return;
    }
  }
  // A barcode scanner types like a keyboard: send stray keystrokes to the page's scan box
  if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1 || e.key === ' ') return;
  if (document.querySelector('dialog[open]')) return;
  if (el && el.matches && el.matches('input, textarea, select, [contenteditable="true"]')) return;
  const scan = $('#view .scan-input');
  if (!scan) return;
  scan.value = '';
  scan.focus();
});
document.addEventListener('input', e => {
  const el = e.target;
  const on = el.dataset ? el.dataset.on : null;
  if (el.id === 'home-q') { ui.homeQuery = el.value; ui.homeHit = null; renderHomeResults(); return; }
  if (el.id === 'sell-scan' || el.id === 'recv-scan' || el.id === 'count-scan') {
    const q = el.value.trim();
    const key = { 'sell-scan': 'sellMsg', 'recv-scan': 'recvMsg', 'count-scan': 'countMsg' }[el.id];
    if (q.length >= 2 && /[^\d\s]/.test(normDigits(q))) {
      const m = searchProducts(q);
      ui[key] = m.length ? { type: 'pick', ids: m.slice(0, 8).map(x => x.id) } : null;
    } else ui[key] = null;
    ({ sellMsg: renderSellMsg, recvMsg: renderRecvMsg, countMsg: renderCountMsg })[key]();
    return;
  }
  if (el.id === 'sell-note') { ui.sellNote = el.value; return; }
  if (el.id === 'recv-note') { ui.recvNote = el.value; return; }
  if (el.id === 'prod-q') { ui.prod.q = el.value; ui.prod.msg = null; renderProdMsg(); renderProdList(); return; }
  if (el.id === 'lbl-q') { ui.labels.q = el.value; renderLabelList(); return; }
  if (el.id === 'lbl-skip') { const n = parseNum(el.value); ui.labels.skip = Number.isFinite(n) ? Math.max(0, Math.min(23, Math.round(n))) : 0; renderLabelSummary(); return; }
  if (on === 'cart-price' || on === 'cart-qty') {
    const i = +el.dataset.i; const l = ui.cart[i]; if (!l) return;
    const n = parseNum(el.value);
    if (n === null || Number.isNaN(n) || n < 0) return;
    if (on === 'cart-price') l.price = round2(n);
    else { if (n < 1) return; l.qty = Math.round(n); const p = getP(l.pid); const note = $(`[data-stock-note="${i}"]`); if (p && note) { const over = l.qty > p.qty; note.className = over ? 'warn-text' : ''; note.textContent = over ? t('over_stock', { n: p.qty }) : t('in_stock_n', { n: p.qty }); } }
    const cell = $(`[data-line-total="${i}"]`); if (cell) cell.innerHTML = moneyH(l.qty * l.price);
    renderSellTotals();
    return;
  }
  if (on === 'recv-qty' || on === 'recv-cost') {
    const l = ui.recv[+el.dataset.i]; if (!l) return;
    const n = parseNum(el.value);
    if (n === null || Number.isNaN(n) || n < 0) return;
    if (on === 'recv-qty') { if (n < 1) return; l.qty = Math.round(n); } else l.cost = round2(n);
    renderRecvTotals();
    return;
  }
  if (on === 'count-n') {
    const l = state.countDraft.lines.find(x => x.pid === el.dataset.pid); if (!l) return;
    const n = parseNum(el.value);
    if (n === null || Number.isNaN(n) || n < 0) return;
    l.n = Math.round(n);
    const p = getP(l.pid);
    const cell = $(`[data-count-diff="${CSS.escape(l.pid)}"]`);
    if (p && cell) cell.innerHTML = diffPill(l.n - p.qty);
    renderCountTotals();
    return;
  }
  if (on === 'lbl-copies') {
    const id = el.dataset.id; const n = parseNum(el.value);
    const c = Number.isFinite(n) ? Math.max(0, Math.min(500, Math.round(n))) : 0;
    if (c > 0) ui.labels.sel.set(id, c); else ui.labels.sel.delete(id);
    const box = $(`[data-lbl-check="${CSS.escape(id)}"]`); if (box) box.checked = c > 0;
    renderLabelSummary();
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  // On leaving a cart field, show the value actually used (or put back the last valid one)
  const on = el.dataset ? el.dataset.on : null;
  if (on === 'cart-price' || on === 'cart-qty') { const l = ui.cart[+el.dataset.i]; if (l) el.value = on === 'cart-price' ? String(l.price) : String(l.qty); return; }
  if (on === 'recv-qty' || on === 'recv-cost') { const l = ui.recv[+el.dataset.i]; if (l) el.value = on === 'recv-qty' ? String(l.qty) : String(l.cost); return; }
  if (on === 'count-n') { const l = state.countDraft.lines.find(x => x.pid === el.dataset.pid); if (l) { el.value = String(l.n); commitQuiet(); } return; }
  if (el.dataset && el.dataset.lblCheck) {
    const p = getP(el.dataset.lblCheck); if (!p) return;
    if (el.checked) ui.labels.sel.set(p.id, defaultCopies(p)); else ui.labels.sel.delete(p.id);
    const copies = $(`[data-on="lbl-copies"][data-id="${CSS.escape(p.id)}"]`); if (copies) copies.value = ui.labels.sel.get(p.id) || '';
    renderLabelSummary();
    return;
  }
  switch (el.id) {
    case 'prod-cat': ui.prod.cat = el.value; renderProdList(); break;
    case 'prod-stock': ui.prod.stock = el.value; renderProdList(); break;
    case 'prod-sort': ui.prod.sort = el.value; renderProdList(); break;
    case 'lbl-gen': ui.labels.onlyGen = el.checked; renderLabelList(); break;
    case 'lbl-price': ui.labels.showPrice = el.checked; renderLabelSummary(); break;
    case 'set-store': state.settings.storeName = el.value.trim(); commit(); renderHeader(); break;
    case 'set-cur': state.settings.currency = el.value.trim(); commit(); break;
    case 'set-min': { const n = parseNum(el.value); state.settings.lowDefault = Number.isFinite(n) && n >= 0 ? Math.round(n) : 2; el.value = state.settings.lowDefault; commit(); break; }
    case 'set-sound': state.settings.sound = el.checked; commit(); if (el.checked) beep(true); break;
    case 'count-loc': state.countDraft.location = el.value; commit(); break;
    case 'import-file':
      try { if (el.files && el.files[0]) await importProducts(el.files[0]); }
      catch (err) { console.error(err); toast(t('import_bad'), 'bad'); }
      el.value = '';
      break;
    case 'restore-file':
      try { if (el.files && el.files[0]) await restoreFrom(el.files[0]); }
      catch (err) { console.error(err); toast(t('restore_bad'), 'bad'); }
      el.value = '';
      break;
  }
});

// Ask before closing while a sale is open or the last change is still being saved
window.addEventListener('beforeunload', e => {
  const unsaved = state && storageMode !== 'memory' && state.rev !== lastSavedRev;

/* ================= Start ================= */
async function init() {
  try { db = await openDB(); storageMode = 'idb'; }
  catch (e) {
    try { localStorage.setItem('__sb', '1'); localStorage.removeItem('__sb'); storageMode = 'local'; }
    catch (e2) { storageMode = 'memory'; }
  }
  let stored = null;
  try { stored = await loadStored(); } catch (e) { console.error(e); }
  state = normalizeState(stored);
  lastSavedRev = stored ? state.rev : 0;
  if (!stored) state.rev = 0;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* optional */ }
  const v = location.hash.slice(1);
  ui.view = NAV.includes(v) ? v : 'home';
  renderAll();
}
